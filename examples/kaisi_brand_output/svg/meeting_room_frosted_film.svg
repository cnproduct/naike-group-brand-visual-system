<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 240" width="1600" height="240">
  <defs>
    <linearGradient id="frostGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="30%" stop-color="rgba(255,255,255,0.75)"/>
      <stop offset="70%" stop-color="rgba(255,255,255,0.75)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.15)"/>
    </linearGradient>
  </defs>

  <!-- Glass panel background -->
  <rect width="1600" height="240" fill="#E2E8F0" opacity="0.3"/>
  <!-- Sandblasted frosted waist film -->
  <rect y="20" width="1600" height="200" fill="url(#frostGrad)"/>
  
  <!-- Optical clear line cuts -->
  <line x1="0" y1="28" x2="1600" y2="28" stroke="#0070F0" stroke-width="2.5" opacity="0.8"/>
  <line x1="0" y1="212" x2="1600" y2="212" stroke="#F88C10" stroke-width="2" opacity="0.6"/>

  <!-- Repeating cutout logo motifs -->
  <g transform="translate(150, 80)">
    <rect width="40" height="40" rx="10" fill="#0070F0"/>
    <circle cx="20" cy="20" r="10" fill="#F88C10"/>
    <text x="54" y="28" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#334155" letter-spacing="2">开思 KAISI</text>
  </g>
  <g transform="translate(650, 80)">
    <rect width="40" height="40" rx="10" fill="#0070F0"/>
    <circle cx="20" cy="20" r="10" fill="#F88C10"/>
    <text x="54" y="28" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#334155" letter-spacing="2">开思 KAISI</text>
  </g>
  <g transform="translate(1150, 80)">
    <rect width="40" height="40" rx="10" fill="#0070F0"/>
    <circle cx="20" cy="20" r="10" fill="#F88C10"/>
    <text x="54" y="28" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#334155" letter-spacing="2">开思 KAISI</text>
  </g>
</svg>