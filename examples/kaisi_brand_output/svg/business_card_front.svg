<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1062 638" width="1062" height="638">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#303030" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0070F0" />
      <stop offset="50%" stop-color="#F88C10" />
      <stop offset="100%" stop-color="#F0B000" />
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1062" height="638" rx="24" fill="url(#cardBg)"/>
  <rect width="1062" height="638" rx="24" fill="url(#gridPattern)"/>

  <!-- Decorative dynamic brand angle -->
  <path d="M 750 0 L 1062 0 L 1062 638 L 880 638 Z" fill="#0070F0" opacity="0.08"/>
  <path d="M 880 0 L 1062 0 L 1062 450 Z" fill="#F88C10" opacity="0.05"/>
  <line x1="0" y1="630" x2="1062" y2="630" stroke="url(#accentLine)" stroke-width="8"/>

  <!-- Logo Mark Graphic -->
  <g transform="translate(100, 240)">
    <rect width="72" height="72" rx="18" fill="#0070F0"/>
    <circle cx="36" cy="36" r="18" fill="#F88C10"/>
    <path d="M 28 36 L 44 36 M 36 28 L 36 44" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <!-- Brand Typography -->
    <text x="96" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" fill="#FFFFFF" letter-spacing="1">开思 KAISI</text>
    <text x="98" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#F0B000" letter-spacing="4">ENTERPRISE GLOBAL VI</text>
  </g>

  <!-- Anti-counterfeiting microchip pill -->
  <rect x="910" y="80" width="52" height="40" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <circle cx="936" cy="100" r="8" fill="none" stroke="#F88C10" stroke-width="1.5"/>
</svg>